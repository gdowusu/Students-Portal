<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students' Portal - Register</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Navbar (same on every page) -->
  <header class="navbar">
    <div class="container">
      <a href="/index.html" class="logo">
        <img src="/images/logo.svg" alt="">
        <span>Students' Portal</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="/index.html">Home</a></li>
          <li><a href="/form.html" class="active">Register</a></li>
          <li><a href="/students.html">Students</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Form section -->
  <main>
    <section class="page">
      <div class="container">
        <h1 class="page-title">Student Registration</h1>
        <p class="page-subtitle">Fill in all the fields below. Every field is required.</p>

        <div class="card">
          <!-- Shown when saving fails -->
          <div id="form-message" class="alert alert-error hidden" role="alert"></div>

          <form id="portal-form" novalidate>
            <div class="form-grid">

              <div class="form-group">
                <label for="firstName">First name</label>
                <input type="text" id="firstName" name="firstName" autocomplete="given-name">
                <span class="field-error"></span>
              </div>

              <div class="form-group">
                <label for="lastName">Last name</label>
                <input type="text" id="lastName" name="lastName" autocomplete="family-name">
                <span class="field-error"></span>
              </div>

              <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" autocomplete="email">
                <span class="field-error"></span>
              </div>

              <div class="form-group">
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone" autocomplete="tel">
                <span class="field-error"></span>
              </div>

              <div class="form-group full">
                <label for="address">Home address</label>
                <input type="text" id="address" name="address" autocomplete="street-address">
                <span class="field-error"></span>
              </div>

              <div class="form-group">
                <label for="dateOfBirth">Date of birth</label>
                <input type="date" id="dateOfBirth" name="dateOfBirth">
                <span class="field-error"></span>
              </div>

              <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" min="10" max="100">
                <span class="field-error"></span>
              </div>

              <!-- Select options are filled in by form.js using fetch() -->
              <div class="form-group">
                <label for="country">Country</label>
                <select id="country" name="country">
                  <option value="">Loading...</option>
                </select>
                <span class="field-error"></span>
              </div>

              <div class="form-group">
                <label for="course">Course of study</label>
                <select id="course" name="course">
                  <option value="">Loading...</option>
                </select>
                <span class="field-error"></span>
              </div>

              <div class="form-group full" id="gender-group">
                <span class="group-label">Gender</span>
                <div class="radio-group">
                  <label><input type="radio" name="gender" value="Male"> Male</label>
                  <label><input type="radio" name="gender" value="Female"> Female</label>
                  <label><input type="radio" name="gender" value="Other"> Other</label>
                </div>
                <span class="field-error"></span>
              </div>

              <div class="form-group full">
                <label for="image">Passport photo (PNG, JPG, GIF or WEBP, max 2 MB)</label>
                <input type="file" id="image" name="image" accept="image/png,image/jpeg,image/gif,image/webp">
                <span class="field-error"></span>
              </div>

            </div>

            <div class="form-actions">
              <button type="submit" class="btn" id="submit-btn">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 Students' Portal. All rights reserved.</p>
  </footer>

  <script src="/js/form.js"></script>
</body>
</html>
