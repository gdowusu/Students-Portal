<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Students' Portal - Student Details</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Top Navbar (same on every page) -->
  <header class="navbar">
    <div class="container">
      <a href="/index.html" class="logo">
        <img src="/images/logo.svg" alt="">
        <span>Students' Portal</span>
      </a>
      <nav>
        <ul class="nav-links">
          <li><a href="/index.html">Home</a></li>
          <li><a href="/form.html">Register</a></li>
          <li><a href="/students.html" class="active">Students</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main section: one student's details, filled in by student.js -->
  <main>
    <section class="page">
      <div class="container">
        <a href="/students.html" class="back-link">&larr; Back to all students</a>
        <h1 class="page-title">Student Details</h1>

        <div id="details-message" class="alert alert-error hidden" role="alert"></div>

        <div class="card" id="details-card" hidden>
          <div class="details">
            <img id="student-photo" class="photo" src="" alt="Student photo">

            <div>
              <dl class="detail-list">
                <div class="detail-item"><dt>Full name</dt><dd id="d-name"></dd></div>
                <div class="detail-item"><dt>Email</dt><dd id="d-email"></dd></div>
                <div class="detail-item"><dt>Phone</dt><dd id="d-phone"></dd></div>
                <div class="detail-item"><dt>Gender</dt><dd id="d-gender"></dd></div>
                <div class="detail-item"><dt>Date of birth</dt><dd id="d-dob"></dd></div>
                <div class="detail-item"><dt>Age</dt><dd id="d-age"></dd></div>
                <div class="detail-item"><dt>Country</dt><dd id="d-country"></dd></div>
                <div class="detail-item"><dt>Course</dt><dd id="d-course"></dd></div>
                <div class="detail-item full"><dt>Address</dt><dd id="d-address"></dd></div>
                <div class="detail-item"><dt>Registered on</dt><dd id="d-created"></dd></div>
                <div class="detail-item"><dt>Admission status</dt><dd><span id="d-status" class="badge"></span></dd></div>
              </dl>

              <!-- Minimal form: status changes are saved asynchronously -->
              <form class="status-panel" id="status-form">
                <label for="status-select">Change admission status</label>
                <div class="row">
                  <select id="status-select" name="status">
                    <option value="Pending">Pending</option>
                    <option value="Admitted">Admitted</option>
                    <option value="Rejected">Rejected</option>
                  </select>
                  <span id="status-feedback" aria-live="polite"></span>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 Students' Portal. All rights reserved.</p>
  </footer>

  <script src="/js/student.js"></script>
</body>
</html>
